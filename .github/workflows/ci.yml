name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # demo/tsconfig.json type-checks ../src/index.tsx directly (dogfooding
      # the real source). That file lives outside demo/, so its bare
      # `import 'react'` resolves starting from its own location — the repo
      # root — not from demo/node_modules. Without the root install, tsc
      # can't find 'react' at all when checking that file.
      - name: Install root dependencies
        run: npm ci

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Type-check demo
        working-directory: demo
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build demo
        working-directory: demo
        run: npm run build
